[build-system]
# 需要它才能把项目安装成包 —— console_scripts（na / na-tui / …）只在
# "项目自身被安装"时才会生成。见 AGENTS.md 与 plan/03-uv.md。
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novel-agent"
version = "0.1.0"
description = "写作专家系统：读文献学习写作 + 长篇小说生成与六维审稿"
requires-python = ">=3.10"
dependencies = [
    # 与 requirements-core.txt 一致：跑命令行与交互界面所需的全部依赖
    "openai>=1.0.0",
    "instructor>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "chardet>=5.0.0",
    "rich>=13.0.0",
    "textual>=6.2",
    "loguru>=0.7.0",
    "tqdm>=4.65.0",
]

[project.scripts]
# 入口实现在 src/cli/entrypoints.py：切到仓库根再委派，保证与 python tui.py 行为一致
na = "src.cli.entrypoints:na"
na-tui = "src.cli.entrypoints:na_tui"
na-tools-preprocess = "src.cli.entrypoints:na_tools_preprocess"
na-studio = "src.cli.entrypoints:na_studio"

[project.optional-dependencies]
# 板块一：读 60GB 文献、embedding、向量检索（数 GB，按需再装）
#   uv sync --extra full     /  pip install -r requirements.txt
full = [
    "chromadb>=0.5.0",
    "sentence-transformers>=2.2.0",
    "rank-bm25>=0.2.0",
    "FlagEmbedding>=1.2.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "jieba>=0.42.1",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "gradio>=4.0.0",
]
test = ["pytest>=8.0.0"]
web = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
]

[tool.uv]
# 需要 true：console_scripts 只在项目自身被安装时才生成。
# uv 默认装成 editable（.pth 指回仓库根），所以改 src/ 立即生效，不会用到副本。
package = true

[tool.hatch.build.targets.wheel]
# src 是代码包；scripts 是 na-tools-preprocess 要用的顶层包
packages = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
